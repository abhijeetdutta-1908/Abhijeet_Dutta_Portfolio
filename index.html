<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>

		<!-- Google Fonts -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>

		<!-- Favicons -->
		<!-- Dark Mode Icons -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/dark/favicon-16x16.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/dark/favicon-32x32.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/dark/apple-touch-icon.png"
			media="(prefers-color-scheme: dark)"
		/>

		<!-- Light Mode Icons -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/light/favicon-16x16.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/light/favicon-32x32.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/light/apple-touch-icon.png"
			media="(prefers-color-scheme: light)"
		/>

		<!-- Primary Meta Tags -->
		<title>Abhijeet Dutta | Full Stack Developer & DevOps Engineer</title>
		<meta name="title" content="Abhijeet Dutta | Full Stack Developer & DevOps Engineer" />
		<meta name="description" content="Portfolio of Abhijeet Dutta, a Full Stack Developer & DevOps Engineer from India. Specializing in MERN stack, Web Development, and creating scalable digital experiences." />
		<meta name="keywords" content="Abhijeet, Abhijeet Dutta, Abhijeet Dutta Portfolio, Full Stack Developer, DevOps Engineer, MERN Stack, React Developer, Web Developer, India" />
		<meta name="author" content="Abhijeet Dutta" />

		<!-- Canonical Tag -->
		<link rel="canonical" href="https://abhijeet-dutta-portfolio.vercel.app/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://abhijeet-dutta-portfolio.vercel.app/" />
		<meta property="og:title" content="Abhijeet Dutta | Full Stack Developer & DevOps Engineer" />
		<meta property="og:description" content="Portfolio of Abhijeet Dutta, a Full Stack Developer & DevOps Engineer from India. Specializing in MERN stack, Web Development, and creating scalable digital experiences." />
		<meta property="og:image" content="https://abhijeet-dutta-portfolio.vercel.app/og-image.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://abhijeet-dutta-portfolio.vercel.app/" />
		<meta property="twitter:title" content="Abhijeet Dutta | Full Stack Developer & DevOps Engineer" />
		<meta property="twitter:description" content="Portfolio of Abhijeet Dutta, a Full Stack Developer & DevOps Engineer from India. Specializing in MERN stack, Web Development, and creating scalable digital experiences." />
		<meta property="twitter:image" content="https://abhijeet-dutta-portfolio.vercel.app/og-image.png" />
